<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dashboard Tamu</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h1 id="welcome"></h1>
    <p>Anda hanya bisa <b>melihat</b> data.</p>

    <button disabled title="Hanya admin">Edit Data</button>
    <button disabled title="Hanya admin">Hapus Data</button>
    <button onclick="logout()">Logout</button>
  </div>

  <script src="js/guard.js"></script>
  <script>
    const user = requireRole('tamu');
    if (user) {
      document.getElementById('welcome').textContent = 'Halo, ' + user.username;
    }
  </script>
</body>
</html>
