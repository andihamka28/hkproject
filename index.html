<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - HKPROJECT</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body {
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .box {
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .box h1 { color: #007bff; margin: 0 0 10px 0; letter-spacing: 2px; font-size: 28px; }
  .box h2 { color: #333; font-size: 18px; margin: 0 0 20px 0; font-weight: normal; }
  input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: #007bff; }
  button {
    padding: 12px 15px;
    margin: 5px 0;
    background: #007bff;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    width: 100%;
    font-family: inherit;
    font-weight: 600;
    transition: 0.2s;
  }
  button:hover { background: #0056b3; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  .btn-guest { background: #28a745; }
  .btn-guest:hover { background: #1e7e34; }

  .error {
    color: #dc3545;
    font-size: 13px;
    min-height: 18px;
    margin: 5px 0;
    text-align: center;
  }
  .divider {
    display: flex;
    align-items: center;
    margin: 18px 0;
    color: #888;
    font-size: 13px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #ddd;
  }
  .divider span { padding: 0 10px; }

  .loading {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid #fff;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin-right: 6px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="box">
  <h1>HKPROJECT</h1>
  <h2>Login</h2>
  <p id="error" class="error"></p>

  <form id="adminForm">
    <input type="email" id="email" placeholder="Email Admin" required autocomplete="username">
    <input type="password" id="password" placeholder="Password Admin" required autocomplete="current-password">
    <button type="submit" id="btnLogin">Login sebagai Admin</button>
  </form>

  <div class="divider"><span>atau</span></div>
  <button id="guestBtn" class="btn-guest">👤 Masuk sebagai Tamu</button>
</div>

<!-- ====== FIREBASE SDK ====== -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

<script>
/* ============================================================
   KONFIGURASI FIREBASE
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDLITYbq1K9PyqCeQNbRgnBOWjrKxVvn_k",
  authDomain: "hkproject-90d37.firebaseapp.com",
  projectId: "hkproject-90d37",
  storageBucket: "hkproject-90d37.firebasestorage.app",
  messagingSenderId: "94510700157",
  appId: "1:94510700157:web:d06cbc47c5796e6df38314"
};

// Inisialisasi Firebase
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const auth = firebase.auth();

/* ============================================================
   CEK SESI — kalau sudah login, langsung ke beranda
============================================================ */
(function cekSesi() {
  const user = sessionStorage.getItem('user');
  if (user) {
    window.location.href = 'beranda.html';
  }
})();

/* ============================================================
   ELEMEN
============================================================ */
const errorEl  = document.getElementById('error');
const btnLogin = document.getElementById('btnLogin');

/* ============================================================
   LOGIN ADMIN (FIREBASE AUTH)
============================================================ */
document.getElementById('adminForm').addEventListener('submit', function (e) {
  e.preventDefault();

  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  errorEl.textContent = '';
  btnLogin.disabled = true;
  btnLogin.innerHTML = '<span class="loading"></span>Memproses...';

  auth.signInWithEmailAndPassword(email, password)
    .then((userCredential) => {
      // Login berhasil
      sessionStorage.setItem('user', JSON.stringify({
        uid: userCredential.user.uid,
        email: userCredential.user.email,
        username: userCredential.user.email,
        role: 'admin'
      }));
      window.location.href = 'beranda.html';
    })
    .catch((error) => {
      console.error('Login error:', error.code, error.message);
      let msg = 'Email atau password salah!';
      if (error.code === 'auth/invalid-email') msg = 'Format email tidak valid!';
      else if (error.code === 'auth/user-not-found') msg = 'Akun tidak ditemukan!';
      else if (error.code === 'auth/wrong-password') msg = 'Password salah!';
      else if (error.code === 'auth/invalid-credential') msg = 'Email atau password salah!';
      else if (error.code === 'auth/too-many-requests') msg = 'Terlalu banyak percobaan. Coba lagi nanti.';

      errorEl.textContent = msg;
      btnLogin.disabled = false;
      btnLogin.textContent = 'Login sebagai Admin';
    });
});

/* ============================================================
   LOGIN TAMU (LANGSUNG)
============================================================ */
document.getElementById('guestBtn').addEventListener('click', function () {
  sessionStorage.setItem('user', JSON.stringify({
    uid: 'guest',
    username: 'Tamu',
    role: 'tamu'
  }));
  window.location.href = 'beranda.html';
});
</script>
</body>
</html>
