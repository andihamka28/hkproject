<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - HKPROJECT</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body {
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .box {
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .box h1 { color: #007bff; margin: 0 0 10px 0; letter-spacing: 2px; font-size: 28px; }
  .box h2 { color: #333; font-size: 18px; margin: 0 0 20px 0; font-weight: normal; }
  input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: #007bff; }
  button {
    padding: 12px 15px;
    margin: 5px 0;
    background: #007bff;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    width: 100%;
    font-family: inherit;
    font-weight: 600;
    transition: 0.2s;
  }
  button:hover { background: #0056b3; }
  .btn-guest { background: #28a745; }
  .btn-guest:hover { background: #1e7e34; }

  .error {
    color: #dc3545;
    font-size: 13px;
    min-height: 18px;
    margin: 5px 0;
    text-align: center;
  }
  .divider {
    display: flex;
    align-items: center;
    margin: 18px 0;
    color: #888;
    font-size: 13px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #ddd;
  }
  .divider span { padding: 0 10px; }
</style>
</head>
<body>

<div class="box">
  <h1>HKPROJECT</h1>
  <h2>Login</h2>
  <p id="error" class="error"></p>

  <form id="adminForm">
    <input type="text" id="username" placeholder="Username Admin" required autocomplete="username">
    <input type="password" id="password" placeholder="Password Admin" required autocomplete="current-password">
    <button type="submit">Login sebagai Admin</button>
  </form>

  <div class="divider"><span>atau</span></div>
  <button id="guestBtn" class="btn-guest">👤 Masuk sebagai Tamu</button>
</div>

<script>
/* ============================================================
   KONFIGURASI ADMIN (HARDCODED)
============================================================ */
const ADMIN = {
  username: 'admin',
  password: 'admin123'
};

/* ============================================================
   CEK SESI — kalau sudah login, langsung ke beranda
============================================================ */
(function cekSesi() {
  const user = sessionStorage.getItem('user');
  if (user) {
    window.location.href = 'beranda.html';
  }
})();

/* ============================================================
   ELEMEN
============================================================ */
const errorEl = document.getElementById('error');

/* ============================================================
   LOGIN ADMIN
============================================================ */
document.getElementById('adminForm').addEventListener('submit', function (e) {
  e.preventDefault();

  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;

  if (u !== ADMIN.username || p !== ADMIN.password) {
    errorEl.textContent = 'Username atau password admin salah!';
    return;
  }

  errorEl.textContent = '';
  sessionStorage.setItem('user', JSON.stringify({
    username: u,
    role: 'admin'
  }));
  window.location.href = 'beranda.html';
});

/* ============================================================
   LOGIN TAMU (LANGSUNG)
============================================================ */
document.getElementById('guestBtn').addEventListener('click', function () {
  sessionStorage.setItem('user', JSON.stringify({
    username: 'Tamu',
    role: 'tamu'
  }));
  window.location.href = 'beranda.html';
});
</script>
</body>
</html>
