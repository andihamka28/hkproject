<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-box">
    <h2>Login Admin</h2>
    <p id="error" class="error"></p>

    <!-- FORM LOGIN ADMIN -->
    <form id="adminForm">
      <input type="text" id="username" placeholder="Username Admin" required>
      <input type="password" id="password" placeholder="Password Admin" required>
      <button type="submit">Login sebagai Admin</button>
    </form>

    <div class="divider"><span>atau</span></div>

    <!-- TOMBOL LANGSUNG MASUK SEBAGAI TAMU -->
    <button id="guestBtn" class="btn-guest">👤 Masuk sebagai Tamu</button>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
